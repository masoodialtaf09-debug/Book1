# Render Blueprint: New > Blueprint, pick this repo. Render asks for each secret below.
services:
  - type: web
    name: relay
    runtime: docker
    plan: free
    healthCheckPath: /api/config
    envVars:
      - key: BASE_URL            # https://relay.diamondwhitedeal.online
        sync: false
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: OPENAI_API_KEY
        sync: false
      - key: PERPLEXITY_API_KEY
        sync: false
      - key: DEEPSEEK_API_KEY
        sync: false
      - key: GEMINI_API_KEY
        sync: false
      - key: GITHUB_TOKEN
        sync: false
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_ANON_KEY
        sync: false
      - key: SUPABASE_SERVICE_KEY
        sync: false
      - key: STRIPE_SECRET_KEY
        sync: false
      - key: STRIPE_WEBHOOK_SECRET
        sync: false
      - key: STRIPE_PRICE_ID
        sync: false
      - key: CREDITS_PER_PACK
        value: "10"
